[SERVICE]
    Flush        2
    Daemon       Off
    Log_Level    info

[INPUT]
    name                tail    
    path                ./data/dataset-*.txt
    exit_on_eof         true
    read_from_head      true        
    DB                  ./log/flb_dataet.db    
    parser              datasetTxt   
    Tag                 dataset     
    Path_Key            file_path
    Buffer_Chunk_Size   64k
    Buffer_Max_Size     64k
    Mem_Buf_Limit       64k

[FILTER]
    Name                lua
    Match               dataset
    Script              batch_control.lua
    Call                process

[OUTPUT]
    Name  stdout
    Match *

[OUTPUT]
    Name        kafka
    Match       *
    Brokers     127.0.0.1:29092
    Topics      pipeline
